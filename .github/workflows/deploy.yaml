name: Deploy to GitHub Pages

on:
    push:
        branches: ["main"]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: "pages"
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Set up Node
              uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: "npm"

            - name: Restore Next.js build cache
              uses: actions/cache@v6
              with:
                  path: .next/cache
                  key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*', 'public/**/*', 'next.config.*') }}
                  restore-keys: |
                      ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

            - name: Install dependencies
              run: npm ci

            - name: Lint
              run: npm run lint

            - name: Typecheck
              run: npm run typecheck

            - name: Test
              run: npm test

            - name: Build
              run: npm run build

            # No .nojekyll: a Pages site deployed from Actions serves the
            # artifact as-is, without a Jekyll pass to hide _next/ from, and
            # upload-pages-artifact v5 drops dotfiles by default anyway.
            - name: Upload artifact
              uses: actions/upload-pages-artifact@v5
              with:
                  path: ./out

    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        needs: build
        runs-on: ubuntu-latest

        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5
