name: Deploy to GitHub Pages

# Pull requests get the same checks and build, without the deploy
on:
    push:
        branches: ["main"]
    pull_request:
    workflow_dispatch:

# Read-only by default; only the deploy job can write to Pages
permissions:
    contents: read

# One run per branch or pull request. A new push replaces a pull request's
# run, but never cancels a deploy that is under way.
concurrency:
    group: pages-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Set up Node
              uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: "npm"

            - name: Restore Next.js build cache
              uses: actions/cache@v6
              with:
                  path: .next/cache
                  key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*', 'public/**/*', 'next.config.*') }}
                  restore-keys: |
                      ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

            - name: Install dependencies
              run: npm ci

            - name: Lint
              run: npm run lint

            - name: Typecheck
              run: npm run typecheck

            - name: Test
              run: npm test

            # The visit tracker's address, a repository variable; the site
            # tracks nothing while it is unset
            - name: Build
              run: npm run build
              env:
                  NEXT_PUBLIC_TRACKER_URL: ${{ vars.TRACKER_URL }}

            # No .nojekyll: a Pages site deployed from Actions serves the
            # artifact as-is, without a Jekyll pass to hide _next/ from, and
            # upload-pages-artifact v5 drops dotfiles by default anyway.
            - name: Upload artifact
              if: github.event_name != 'pull_request'
              uses: actions/upload-pages-artifact@v5
              with:
                  path: ./out

    deploy:
        if: github.event_name != 'pull_request'
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        needs: build
        runs-on: ubuntu-latest

        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5
